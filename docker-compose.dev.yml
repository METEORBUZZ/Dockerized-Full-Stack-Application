name: dockerized-fullstack-dev

services:
  # PostgreSQL Service
  postgres:
    image: postgres:16-alpine
    container_name: fullstack-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-fullstack_db}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - app-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fullstack_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Express API Service (Live Hot Reload via tsx watch)
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: fullstack-api-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      API_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_dev_password}
      DB_NAME: ${POSTGRES_DB:-fullstack_db}
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./server/src:/app/src
      - /app/node_modules
    ports:
      - "5000:5000"
    networks:
      - app-network-dev
    depends_on:
      postgres:
        condition: service_healthy

  # React Client Service (Vite Dev Server with Polling HMR)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: fullstack-client-dev
    restart: unless-stopped
    environment:
      - VITE_API_PROXY_TARGET=http://api:5000
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - app-network-dev
    depends_on:
      - api

volumes:
  postgres_data_dev:
    driver: local

networks:
  app-network-dev:
    driver: bridge
